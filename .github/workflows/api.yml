name: api

on:
  push:
    branches: [master]
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: api

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dnd_forge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/dnd_forge_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: api

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: sqlc diff
        run: sqlc diff

      - name: openapi.json up to date
        run: |
          go run ./cmd/tools openapi -o openapi.json
          git diff --exit-code -- openapi.json

      # nodynamic: test the same pure-Go WebP encoder the image ships.
      - run: go test -race -tags nodynamic ./...
      # Integration tests share one database, so packages run one at a time.
      - run: go test -race -p 1 -tags integration,nodynamic ./...

      - name: release binaries are static
        run: |
          for cmd in api tools; do
            CGO_ENABLED=0 go build -tags nodynamic -o "/tmp/$cmd" "./cmd/$cmd"
            if readelf -l "/tmp/$cmd" | grep -q INTERP; then
              echo "::error::$cmd is dynamically linked; it will not start on distroless/static"
              exit 1
            fi
          done

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/gewall/dnd-forge-api:latest
            ghcr.io/gewall/dnd-forge-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
