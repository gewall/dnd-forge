name: web

on:
  push:
    branches: [master]
    paths: ["web/**", "api/openapi.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "api/openapi.json", ".github/workflows/web.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: schema.d.ts up to date with api/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api/schema.d.ts

      - run: npm test
      # Deploys go through Vercel's Git integration; this only proves the build.
      - run: npm run build
