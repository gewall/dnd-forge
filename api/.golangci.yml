version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # DTO dan sentinel error sudah jelas dari namanya
  exclusions:
    presets: [std-error-handling]
    paths:
      - internal/db/sqlc

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/gewall/dnd-forge]
